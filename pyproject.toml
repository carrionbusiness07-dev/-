[project]
name = "minsk-realty"
version = "0.1.0"
description = "История объявлений о продаже квартир в Минске (Kufar, Realt, Onliner, Domovita)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=1.0",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn>=0.30",
    # phash фото для склейки уровня 2 (сами фото не храним).
    "imagehash>=4.3",
    "Pillow>=10",
    # Telegram-бот (python -m minsk_realty.bot).
    "aiogram>=3.31,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minsk_realty = ["web/templates/*.html", "web/static/*.css", "web/static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
