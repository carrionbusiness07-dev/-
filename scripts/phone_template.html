<title>Конспект CoinGlass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first reading column with a sticky tab bar; same palette as the trainer. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --sunken: #f5f7f9;
  --ink: #15202b;
  --muted: #4c5866;
  --line: #d5dbe2;
  --accent: #2b59c3;
  --accent-soft: rgba(43, 89, 195, .1);
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --surface: #161d26; --sunken: #121820; --ink: #e3e8ee; --muted: #93a0ae; --line: #2a3441;
    --accent: #84a6ff; --accent-soft: rgba(132, 166, 255, .14); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #161d26; --sunken: #121820; --ink: #e3e8ee; --muted: #93a0ae; --line: #2a3441;
  --accent: #84a6ff; --accent-soft: rgba(132, 166, 255, .14); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 760px; margin: 0 auto; }

header.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
header.top .inner { display: grid; gap: 6px; padding-block: 12px 0; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
.tab { font: inherit; font-size: 15px; font-weight: 500; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px 10px; cursor: pointer; white-space: nowrap; text-decoration: none; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab.ext { margin-left: auto; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { padding-block: 20px 64px; }
.toc { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 20px; }
.toc summary { cursor: pointer; font-weight: 600; }
.toc ol { margin: 8px 0 2px; padding-left: 20px; display: grid; gap: 4px; }
.toc a { color: var(--accent); text-decoration: none; }

.md { min-width: 0; overflow-wrap: anywhere; }
.md h1 { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.15; margin: 0 0 14px; text-wrap: balance; }
.md h2 { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.2; margin: 32px 0 10px; text-wrap: balance; scroll-margin-top: 110px; }
.md h3 { font-size: 17px; font-weight: 600; margin: 22px 0 6px; scroll-margin-top: 110px; }
.md p, .md ul, .md ol { margin: 0 0 12px; }
.md ul, .md ol { padding-left: 22px; }
.md li { margin: 3px 0; }
.md a { color: var(--accent); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
.md blockquote { margin: 0 0 16px; padding: 10px 14px; background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; }
.md blockquote p:last-child { margin-bottom: 0; }
.md code { font-family: var(--font-data); font-size: .88em; background: var(--sunken); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.md pre { background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; }
.md pre code { border: 0; padding: 0; background: none; font-size: 13px; }
.table-wrap { overflow-x: auto; margin: 0 0 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.md table { border-collapse: collapse; width: 100%; font-size: 14px; }
.md th, .md td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); min-width: 90px; }
.md th { background: var(--sunken); font-weight: 600; }
.md tr:last-child td { border-bottom: 0; }
@media (min-width: 700px) { .md h1 { font-size: 34px; } }
</style>

<header class="top gutter">
  <div class="inner">
    <div class="brand">Конспект CoinGlass</div>
    <nav class="tabs" role="tablist">
{{TABS}}
    </nav>
  </div>
</header>

<main class="gutter">
  <div class="inner">
{{PANES}}
  </div>
</main>

<script>
const panes = [...document.querySelectorAll(".pane")];
const tabs = [...document.querySelectorAll("button.tab")];
function show(id, keepScroll) {
  panes.forEach(p => { p.hidden = p.id !== id; });
  tabs.forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === id)));
  try { localStorage.setItem("cg-konspekt-tab", id); } catch (e) {}
  if (!keepScroll) window.scrollTo(0, 0);
}
tabs.forEach(t => t.addEventListener("click", () => show(t.dataset.tab)));
document.addEventListener("click", e => {
  const a = e.target.closest("a[href^='#']");
  if (!a) return;
  const id = decodeURIComponent(a.getAttribute("href").slice(1));
  const pane = panes.find(p => p.id === id);
  if (pane) { e.preventDefault(); show(id); return; }
  const el = document.getElementById(id);
  if (el) {
    e.preventDefault();
    show(el.closest(".pane").id, true);
    el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }
});
let start = location.hash.slice(1);
if (!panes.some(p => p.id === start)) {
  try { start = localStorage.getItem("cg-konspekt-tab") || ""; } catch (e) { start = ""; }
}
show(panes.some(p => p.id === start) ? start : panes[0].id);
</script>
