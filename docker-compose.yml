# Запуск на сервере в Беларуси (Kufar закрыт для запросов из-за рубежа):
#   cp .env.example .env  # заполнить
#   docker compose up -d --build
name: minsk-realty

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  build: .
  env_file: .env
  # Адрес БД собирается из одного пароля, чтобы он не разъехался в двух местах.
  environment:
    DATABASE_URL: postgresql+psycopg://realty:${POSTGRES_PASSWORD}@db:5432/realty
  init: true
  logging: *logging

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: realty
      POSTGRES_DB: realty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realty"]
      interval: 10s
      retries: 5
    logging: *logging

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  collector:
    <<: *app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
