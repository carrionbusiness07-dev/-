# Запуск на сервере в Беларуси (Kufar закрыт для запросов из-за рубежа):
#   cp .env.example .env  # заполнить
#   docker compose up -d --build
name: minsk-realty

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  build: .
  env_file: .env
  # Адрес БД собирается из одного пароля, чтобы он не разъехался в двух местах.
  environment:
    DATABASE_URL: postgresql+psycopg://realty:${POSTGRES_PASSWORD}@db:5432/realty
  init: true
  logging: *logging

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: realty
      POSTGRES_DB: realty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realty"]
      interval: 10s
      retries: 5
    logging: *logging

  # Основная база, затем база аренды (realty_rent): создаётся, если её нет, и та же схема.
  migrate:
    <<: *app
    environment:
      DATABASE_URL: postgresql+psycopg://realty:${POSTGRES_PASSWORD}@db:5432/realty
      RENT_DATABASE_URL: postgresql+psycopg://realty:${POSTGRES_PASSWORD}@db:5432/realty_rent
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        python scripts/create_rent_db.py &&
        DATABASE_URL="$$RENT_DATABASE_URL" alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  collector:
    <<: *app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://realty:${POSTGRES_PASSWORD}@db:5432/realty
      # Долгосрочная аренда: своя база, тот же цикл после продажи.
      RENT_DATABASE_URL: postgresql+psycopg://realty:${POSTGRES_PASSWORD}@db:5432/realty_rent
    # Дать проходу закрыть запись в журнале, а не обрываться на середине.
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Кабинет «Хроника»: http://localhost:8080 (только с этого компьютера).
  web:
    <<: *app
    restart: unless-stopped
    command: ["python", "-m", "minsk_realty.web"]
    environment:
      DATABASE_URL: postgresql+psycopg://realty:${POSTGRES_PASSWORD}@db:5432/realty
      WEB_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Telegram-бот «Хроники»: /check по ссылке, «Мои квартиры», уведомления, сводка в канал.
  # Long polling — порты наружу не нужны. Нужен TELEGRAM_BOT_TOKEN в .env.
  bot:
    <<: *app
    restart: unless-stopped
    command: ["python", "-m", "minsk_realty.bot"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Резервная копия баз раз в сутки: папка backups/ рядом с проектом, последние 14 дней.
  # realty-ДАТА.dump — продажа, realty_rent-ДАТА.dump — аренда.
  # Раз в час проверяет, есть ли копия за сегодня, — выключенный ночью компьютер не мешает.
  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: realty
      PGDATABASE: realty
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Minsk  # дата в имени файла — по Минску
    volumes:
      - ./backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap 'exit 0' TERM INT
        while true; do
          for db in realty realty_rent; do
            f=/backups/$$db-$$(date +%Y-%m-%d).dump
            if [ ! -f "$$f" ]; then
              rm -f /backups/$$db-*.dump.tmp
              if pg_dump -Fc -d "$$db" -f "$$f.tmp"; then
                mv "$$f.tmp" "$$f" && echo "бэкап готов: $$f"
                find /backups -name "$$db-*.dump" -mtime +14 -delete
              else
                rm -f "$$f.tmp"; echo "бэкап $$db не удался, повтор через час"
              fi
            fi
          done
          sleep 3600 & wait $$!
        done
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
